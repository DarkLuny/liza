<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Для тебя 💕</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#ffb6c8">
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #ffb6c8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  canvas { position: fixed; inset: 0; display: block; }
  #heartCanvas { z-index: 1; }
  #glassCanvas { z-index: 2; pointer-events: none; }

  .stage {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }

  .card {
    position: relative;
    width: min(440px, 92vw);
    padding: 34px 28px;
    border-radius: 34px;
    text-align: center;
    pointer-events: auto;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow:
      0 18px 50px rgba(150, 30, 80, 0.18),
      inset 0 1px 0 rgba(255,255,255,0.45);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  #card2 { width: min(440px, 92vw); display: none; }

  .floating { animation: float 7s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(-6px); }
    50%      { transform: translateY(6px); }
  }

  .title {
    font-size: clamp(1.35rem, 6vw, 2rem);
    font-weight: 700;
    color: #4e0f2b;
    line-height: 1.35;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    margin-bottom: 26px;
  }

  .buttons-container {
    display: flex; gap: 16px;
    justify-content: center; align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    position: relative;
    padding: 14px 34px;
    border: none;
    border-radius: 999px;
    background: transparent;
    font-size: clamp(1rem, 4.5vw, 1.2rem);
    font-weight: 700;
    font-family: inherit;
    color: #4e0f2b;
    cursor: pointer;
    outline: none;
    text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  
  .btn-yes:hover  { transform: scale(1.1); }
  .btn-yes:active { transform: scale(0.94); }

  .btn-no {
    z-index: 100;
    color: #55071d;
    transition: left 0.42s cubic-bezier(.3,1.15,.4,1),
                top  0.42s cubic-bezier(.3,1.15,.4,1);
  }
  .btn-no.instant { transition: none; }

  .love-text {
    font-size: clamp(1rem, 4.6vw, 1.35rem);
    line-height: 1.75;
    color: #4e0f2b;
    font-weight: 600;
    text-shadow: 0 1px 0 rgba(255,255,255,0.45);
  }

  .love-text .word { display: inline-block; white-space: nowrap; }

  .letter {
    display: inline-block;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1),
                color 0.22s ease,
                text-shadow 0.22s ease;
  }

  .letter.hot {
    transform: translateY(-4px) scale(1.15);
    color: #a1114f;
    text-shadow:
      0 0 8px rgba(255,255,255,0.95),
      0 0 18px rgba(255,120,185,0.95),
      0 0 30px rgba(255,80,150,0.7);
  }

  .letter.gone { visibility: hidden; }

  .letter.back1 { animation: backPop 0.75s cubic-bezier(.34,1.56,.64,1); }
  @keyframes backPop {
    0%   { transform: scale(0) rotate(-25deg); opacity: 0; }
    60%  { transform: scale(1.3) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .letter.back2 { animation: backDrop 0.85s cubic-bezier(.3,1.4,.5,1); }
  @keyframes backDrop {
    0%   { transform: translateY(-38px) scale(1.1); opacity: 0; filter: blur(4px); }
    55%  { transform: translateY(6px) scale(0.94); opacity: 1; filter: blur(0); }
    75%  { transform: translateY(-3px) scale(1.04); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .letter.back3 { animation: backSpin 0.9s cubic-bezier(.22,1,.3,1); }
  @keyframes backSpin {
    0%   { transform: rotateY(90deg) scale(0.6); opacity: 0; }
    60%  { transform: rotateY(-14deg) scale(1.12); opacity: 1; }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
  }
  .letter.back4 { animation: backGlow 1s ease-out; }
  @keyframes backGlow {
    0%   { opacity: 0; filter: blur(9px); text-shadow: 0 0 26px rgba(255,110,175,1); transform: scale(1.35); }
    50%  { opacity: 1; filter: blur(2px); text-shadow: 0 0 18px rgba(255,110,175,0.9); transform: scale(1.08); }
    100% { opacity: 1; filter: blur(0); transform: scale(1); }
  }
  .letter.back5 { animation: backSwing 0.95s cubic-bezier(.28,1.5,.45,1); }
  @keyframes backSwing {
    0%   { transform: translateX(-22px) rotate(-40deg) scale(0.5); opacity: 0; }
    45%  { transform: translateX(6px) rotate(14deg) scale(1.15); opacity: 1; }
    70%  { transform: translateX(-3px) rotate(-6deg) scale(0.98); }
    100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
  }
  .letter.back6 { animation: backRise 0.9s cubic-bezier(.25,1.3,.4,1); }
  @keyframes backRise {
    0%   { transform: translateY(26px) scaleY(0.4) scaleX(1.25); opacity: 0; }
    55%  { transform: translateY(-5px) scaleY(1.12) scaleX(0.94); opacity: 1; }
    100% { transform: translateY(0) scaleY(1) scaleX(1); opacity: 1; }
  }
  .accent-word { color: #d81b4a; }

  .love-text .word.accent .letter { color: #d81b4a; }
  .love-text .word.accent .letter.hot {
    color: #ff2d62;
    text-shadow:
      0 0 8px rgba(255,255,255,0.95),
      0 0 18px rgba(255,90,140,0.95),
      0 0 30px rgba(255,40,90,0.7);
  }
  .shard {
    position: fixed;
    z-index: 150;
    pointer-events: none;
    display: block;
    text-align: center;
    will-change: transform, opacity;
  }

  .fade-out { opacity: 0; transform: scale(0.9); pointer-events: none; }
  .fade-in  { animation: smoothAppear 0.8s ease forwards; }
  @keyframes smoothAppear {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  #soundToggle {
    position: fixed;
    top: 14px; right: 14px; z-index: 200;
    width: 42px; height: 42px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    color: #4e0f2b;
    transition: transform 0.18s ease, background 0.2s ease;
  }
  #soundToggle:hover  { transform: scale(1.1); background: rgba(255,255,255,0.3); }
  #soundToggle:active { transform: scale(0.92); }
  /* ---------- игра ---------- */
  #gameCanvas { z-index: 4; pointer-events: none; }
  #gameCanvas.on { pointer-events: auto; }

  #gameLayer { position: fixed; inset: 0; z-index: 5; display: none; pointer-events: none; }
  #gameLayer.on { display: flex; flex-direction: column; align-items: center; }

  #gameHud {
    flex: 0 0 auto;
    width: 100%;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    text-align: center;
    color: #4e0f2b;
    text-shadow: 0 2px 12px rgba(255,255,255,0.75);
  }
  #gameScore {
    font-size: clamp(1.6rem, 7vmin, 3.2rem);
    font-weight: 800;
    line-height: 1.05;
  }
  #gameBest {
    font-size: clamp(0.68rem, 2.4vmin, 0.85rem);
    font-weight: 700;
    opacity: 0.7;
    margin-top: 2px;
  }

  .game-panel {
    position: static;
    transform: none;
    margin: auto;
    width: min(360px, 88vw);
    max-height: calc(100% - 24px);
    overflow-y: auto;
    padding: clamp(16px, 4.2vmin, 26px) clamp(14px, 3.6vmin, 22px);
    border-radius: clamp(20px, 5vmin, 30px);
    text-align: center;
    pointer-events: auto;
    color: #4e0f2b;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.42);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: 0 18px 50px rgba(150,30,80,0.22), inset 0 1px 0 rgba(255,255,255,0.5);
    animation: smoothAppear 0.45s ease forwards;
  }
  .game-panel.hidden { display: none; }
  .game-title {
    font-size: clamp(1rem, 4.4vmin, 1.6rem);
    font-weight: 800;
    margin-bottom: clamp(6px, 1.6vmin, 10px);
  }
  .game-sub {
    font-size: clamp(0.8rem, 3vmin, 0.95rem);
    font-weight: 600;
    line-height: 1.5;
    opacity: 0.88;
    margin-bottom: clamp(12px, 3vmin, 20px);
  }
  .game-actions { display: flex; gap: clamp(8px, 2vmin, 10px); justify-content: center; flex-wrap: wrap; }
  .game-btn {
    font-family: inherit;
    font-size: clamp(0.85rem, 3.2vmin, 1rem);
    font-weight: 700;
    padding: clamp(9px, 2.4vmin, 12px) clamp(16px, 5vmin, 24px);
    border-radius: 999px;
    cursor: pointer;
    color: #4e0f2b;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.28);
    transition: transform 0.16s cubic-bezier(.34,1.56,.64,1), background 0.2s ease;
  }
  .game-btn:hover  { transform: scale(1.06); background: rgba(255,255,255,0.42); }
  .game-btn:active { transform: scale(0.95); }
  .game-btn.ghost  { background: rgba(255,255,255,0.12); }

  /* низкие экраны: телефон в горизонтальной ориентации */
  @media (max-height: 480px) {
    #gameHud { padding-top: 4px; }
    #gameScore { font-size: clamp(1.2rem, 8vh, 1.8rem); }
    #gameBest { display: none; }
    .game-panel { width: min(440px, 92vw); padding: 12px 16px; }
    .game-sub { margin-bottom: 10px; line-height: 1.35; }
    .game-actions { flex-wrap: nowrap; }
  }

  .game-hidden { opacity: 0 !important; pointer-events: none !important; transition: opacity 0.35s ease; }

  #comboBadge {
    position: fixed;
    z-index: 6;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) scale(0.82);
    max-width: 80vw;
    padding: clamp(6px, 1.8vmin, 8px) clamp(12px, 4vmin, 18px);
    border-radius: 999px;
    font-weight: 800;
    font-size: clamp(0.8rem, 3vmin, 0.95rem);
    white-space: nowrap;
    color: #4e0f2b;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  #comboBadge.on { opacity: 1; transform: translateX(-50%) scale(1); }
</style>
</head>
<body>

<canvas id="heartCanvas"></canvas>
<canvas id="glassCanvas"></canvas>

<canvas id="gameCanvas"></canvas>
<div id="gameLayer">
  <div id="gameHud">
    <div id="gameScore">0</div>
    <div id="gameBest">Лучший: 0</div>
  </div>
  <div class="game-panel" id="gamePanel">
    <div class="game-title" id="gameTitle">Секретный уровень 💗</div>
    <div class="game-sub" id="gameSub"></div>
    <div class="game-actions">
      <button class="game-btn" id="gamePlay">Полетели</button>
      <button class="game-btn ghost" id="gameExit">Выйти</button>
    </div>
  </div>
</div>
<div id="comboBadge"></div>

<div class="stage">
  <div class="card floating" id="card1">
    <div class="title">Люблю тебя<br>А <span class="accent-word">ты</span>?</div>
    <div class="buttons-container" id="btnWrapper">
      <button class="btn btn-yes" id="btnYes">Да</button>
      <button class="btn btn-no" id="btnNo">Нет</button>
    </div>
  </div>

  <div class="card" id="card2">
    <div class="love-text" id="loveText"></div>
  </div>
</div>

<script>
/* ============================================================
   AUDIO
   ============================================================ */
const sfx = (() => {
  let ctx = null, master = null, muted = false;
  let armed = false;

  function ensure() {
    if (!armed) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function arm() { armed = true; return ensure(); }

  function tone({ freq = 440, type = 'sine', dur = 0.25, vol = 0.2, delay = 0, glide = null, pan = 0 }) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (glide !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, glide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = g;
    if (c.createStereoPanner && pan !== 0) {
      const p = c.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p);
      node = p;
    }
    osc.connect(g);
    node.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function noise({ dur = 0.18, vol = 0.12, hp = 1200, delay = 0 }) {
    if (muted) return;
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = 'highpass';
    filt.frequency.value = hp;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt); filt.connect(g); g.connect(master);
    src.start(t0);
  }

  const panFor = x => (typeof x === 'number' && window.innerWidth) ? (x / window.innerWidth) * 1.6 - 0.8 : 0;

  return {
    arm,
    unlock: () => ensure(),
    get muted() { return muted; },
    toggle() { muted = !muted; if (!muted) ensure(); return muted; },
    pop(x) {
      tone({ freq: 520 + Math.random() * 120, type: 'sine', dur: 0.22, vol: 0.16, glide: 190, pan: panFor(x) });
      noise({ dur: 0.13, vol: 0.05, hp: 2200 });
    },
    split(x) {
      const p = panFor(x);
      tone({ freq: 700, type: 'triangle', dur: 0.16, vol: 0.13, glide: 340, pan: p });
      tone({ freq: 1040, type: 'sine', dur: 0.2, vol: 0.08, glide: 620, delay: 0.05, pan: p });
      noise({ dur: 0.16, vol: 0.055, hp: 2600 });
    },
    restore(x) {
      const p = panFor(x);
      tone({ freq: 1174.7, type: 'sine', dur: 0.4, vol: 0.09, pan: p });
      tone({ freq: 1567.9, type: 'sine', dur: 0.5, vol: 0.06, delay: 0.06, pan: p });
    },
    letter(x) {
      const p = panFor(x);
      noise({ dur: 0.09, vol: 0.09, hp: 3400 });
      tone({ freq: 1400, type: 'triangle', dur: 0.12, vol: 0.07, glide: 380, pan: p });
      tone({ freq: 620, type: 'sine', dur: 0.22, vol: 0.06, glide: 180, delay: 0.03, pan: p });
    },
    hover(x) {
      tone({ freq: 900 + Math.random() * 300, type: 'sine', dur: 0.08, vol: 0.03, pan: panFor(x) });
    },
    yes() {
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
        tone({ freq: f, type: 'triangle', dur: 0.7, vol: 0.14, delay: i * 0.085 });
        tone({ freq: f * 2, type: 'sine', dur: 0.5, vol: 0.05, delay: i * 0.085 });
      });
      noise({ dur: 0.6, vol: 0.05, hp: 4000, delay: 0.1 });
    },
    no(x) {
      const p = panFor(x);
      tone({ freq: 240, type: 'square', dur: 0.16, vol: 0.09, glide: 620, pan: p });
      tone({ freq: 620, type: 'sine', dur: 0.14, vol: 0.07, glide: 200, delay: 0.09, pan: p });
    },
    tap(x) {
      tone({ freq: 220 + Math.random() * 60, type: 'sine', dur: 0.18, vol: 0.06, glide: 140, pan: panFor(x) });
    }
  };
})();

/* ============================================================
   CANVAS 2D
   ============================================================ */
const heartCanvas = document.getElementById('heartCanvas');
const ctx = heartCanvas.getContext('2d', { alpha: false });
const glassCanvas = document.getElementById('glassCanvas');

// фон рисуется в треть разрешения и растягивается: он весь из мягких
// градиентов, поэтому апскейл визуально неотличим, а пикселей в 9 раз меньше
const BG_SCALE = 0.34;
const bgCanvas = document.createElement('canvas');
const bctx = bgCanvas.getContext('2d', { alpha: false });

let W = 0, H = 0;
const DPR = 1;                 // сцена в CSS-пикселях
let isMobile = false;

let hearts = [], particles = [], ripples = [], bokeh = [], blobs = [];
let isInteractive = false;
let noVisible = true;
let noButtonRunning = false;
let lastSpawn = 0;

const AUTOSPAWN_CAP = 70;
const MAX_PARTICLES = 240;

const pointer = { x: 0, y: 0, active: false };

const PALETTE = [
  { h: 344, s: 58, l: 66 },
  { h: 352, s: 66, l: 62 },
  { h: 336, s: 44, l: 70 },
  { h:   8, s: 54, l: 69 },
  { h: 328, s: 38, l: 73 }
];

/* ---------- спрайты сердец ---------- */
const heartSprites = new Map();

function tracePath(c, d) {
  c.beginPath();
  c.moveTo(0, -d * 0.26);
  c.bezierCurveTo(-d * 0.52, -d * 0.86, -d * 1.02, -d * 0.10, 0, d * 0.66);
  c.bezierCurveTo(d * 1.02, -d * 0.10, d * 0.52, -d * 0.86, 0, -d * 0.26);
  c.closePath();
}

function heartSprite(pi, size, blur) {
  const d = Math.max(6, Math.round(size / 3) * 3);
  const b = Math.min(8, Math.round(blur));
  const key = pi * 10000 + d * 10 + b;

  let sp = heartSprites.get(key);
  if (sp) return sp;

  const half = Math.ceil(d * 1.85 + b * 3 + 6);
  const S = half * 2;

  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const c = cv.getContext('2d');
  c.translate(half, half);
  if (b > 0) c.filter = 'blur(' + b + 'px)';

  const { h, s, l } = PALETTE[pi];

  c.shadowColor = `hsla(${h - 10}, 45%, 35%, 0.22)`;
  c.shadowBlur = d * 0.55;
  c.shadowOffsetY = d * 0.14;

  const g = c.createLinearGradient(-d * 0.55, -d * 0.7, d * 0.5, d * 0.7);
  g.addColorStop(0,    `hsl(${h + 4}, ${s - 6}%, ${Math.min(l + 11, 88)}%)`);
  g.addColorStop(0.55, `hsl(${h}, ${s}%, ${l}%)`);
  g.addColorStop(1,    `hsl(${h - 8}, ${s - 10}%, ${Math.max(l - 15, 38)}%)`);
  c.fillStyle = g;
  tracePath(c, d);
  c.fill();

  c.shadowBlur = 0;
  c.shadowOffsetY = 0;

  c.save();
  tracePath(c, d);
  c.clip();
  const hg = c.createRadialGradient(-d * 0.3, -d * 0.34, 0, -d * 0.3, -d * 0.34, d * 0.85);
  hg.addColorStop(0,   'rgba(255,255,255,0.30)');
  hg.addColorStop(0.4, 'rgba(255,255,255,0.09)');
  hg.addColorStop(1,   'rgba(255,255,255,0)');
  c.fillStyle = hg;
  c.fillRect(-d * 1.2, -d * 1.2, d * 2.4, d * 2.4);
  c.restore();

  sp = { cv, d, half };
  if (heartSprites.size > 200) heartSprites.clear();
  heartSprites.set(key, sp);
  return sp;
}

/* ---------- спрайты искр ---------- */
const sparkSprites = new Map();

function sparkSprite(hue) {
  const hb = Math.round(hue / 8) * 8;
  let cv = sparkSprites.get(hb);
  if (cv) return cv;

  const S = 32;
  cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0,    `hsla(${hb}, 60%, 88%, 1)`);
  g.addColorStop(0.42, `hsla(${hb}, 58%, 78%, 0.85)`);
  g.addColorStop(0.7,  `hsla(${hb}, 55%, 80%, 0.28)`);
  g.addColorStop(1,    `hsla(${hb}, 55%, 80%, 0)`);
  c.fillStyle = g;
  c.fillRect(0, 0, S, S);

  sparkSprites.set(hb, cv);
  return cv;
}

class SparkParticle {
  constructor(x, y, hue) { this.reset(x, y, hue); }
  reset(x, y, hue) {
    this.x = x; this.y = y;
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3.4;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s;
    this.life = 1;
    this.decay = 0.012 + Math.random() * 0.02;
    this.size = 1.4 + Math.random() * 2.6;
    this.spr = sparkSprite(hue ?? 345);
    return this;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.06;
    this.vx *= 0.985;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    const r = this.size * this.life * 2.2;
    ctx.globalAlpha = 0.78 * this.life;
    ctx.drawImage(this.spr, this.x - r, this.y - r, r * 2, r * 2);
  }
}

const sparkPool = [];
function addSpark(x, y, hue) {
  if (particles.length >= MAX_PARTICLES) return;
  const p = sparkPool.pop();
  particles.push(p ? p.reset(x, y, hue) : new SparkParticle(x, y, hue));
}

/* ---------- сердце ---------- */
class Heart3D {
  constructor(x, y, sz) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? H + Math.random() * 100;
    this.depth = Math.random();

    const base = isMobile ? 13 : 22;
    this.size = (sz ?? base + Math.random() * base) * (0.78 + this.depth * 0.45);

    this.vx = (Math.random() - 0.5) * 0.8 * (0.5 + this.depth);
    this.vy = (-Math.random() * 0.8 - 0.4) * (0.5 + this.depth);

    this.pi = Math.floor(Math.random() * PALETTE.length);
    this.hue = PALETTE[this.pi].h;

    this.alpha = 0.42 + this.depth * 0.42;
    this.blur = (1 - this.depth) * (isMobile ? 1.2 : 2.6);

    this.rot = (Math.random() - 0.5) * 0.5;
    this.rotSpeed = (Math.random() - 0.5) * 0.005;
    this.phase = Math.random() * 6.283;
    this.pulse = 0.012 + Math.random() * 0.018;
  }

  update(step) {
    const k = step || 1;
    this.phase += this.pulse * k;
    this.rot += this.rotSpeed * k;
    this.x += (this.vx + Math.sin(this.phase * 0.4) * 0.18) * k;
    this.y += this.vy * k;

    if (pointer.active) {
      const dx = this.x - pointer.x, dy = this.y - pointer.y;
      const d2 = dx * dx + dy * dy;
      const R = isMobile ? 90 : 130;
      if (d2 < R * R && d2 > 0.0001) {
        const dist = Math.sqrt(d2);
        const f = (1 - dist / R) * 0.035 * (0.4 + this.depth) * k;
        this.vx += (dx / dist) * f;
        this.vy += (dy / dist) * f;
      }
    }
    this.vx *= 0.99; this.vy *= 0.99;
    if (this.vx > 4) this.vx = 4; else if (this.vx < -4) this.vx = -4;
    if (this.vy > 4) this.vy = 4; else if (this.vy < -4) this.vy = -4;

    if (this.x < -this.size) { this.x = -this.size; this.vx *= -1; }
    if (this.x > W + this.size) { this.x = W + this.size; this.vx *= -1; }
    if (this.y < -this.size) { this.y = -this.size; this.vy *= -1; }
    if (this.y > H + this.size) { this.y = H + this.size; this.vy *= -1; }
  }

  draw(c) {
    const g2 = c || ctx;
    const m = this.size * 2.2;
    if (this.x < -m || this.x > W + m || this.y < -m || this.y > H + m) return;

    const sp = heartSprite(this.pi, this.size, this.blur);
    const k = this.size / sp.d;
    const p = 1 + Math.sin(this.phase) * 0.03;

    g2.save();
    g2.globalAlpha = this.alpha;
    g2.translate(this.x, this.y);
    g2.rotate(this.rot + Math.sin(this.phase * 0.5) * 0.04);
    g2.scale(k * p, k / p);
    g2.drawImage(sp.cv, -sp.half, -sp.half);
    g2.restore();
  }

  isClicked(mx, my) {
    const dx = this.x - mx, dy = this.y - my, r = this.size * 1.2;
    return dx * dx + dy * dy < r * r;
  }

  split() {
    const n = 2 + Math.floor(Math.random() * 2), ns = this.size * 0.6;
    for (let i = 0; i < 12; i++) addSpark(this.x, this.y, this.hue);
    ripples.push({ x: this.x, y: this.y, r: this.size * 0.5, a: 0.4 });
    if (ns < (isMobile ? 7 : 5)) return [];
    const arr = [];
    for (let i = 0; i < n; i++) {
      const hrt = new Heart3D(this.x, this.y, ns);
      hrt.vx = (Math.random() - 0.5) * 2.4;
      hrt.vy = (Math.random() - 0.5) * 2.4 - 0.5;
      arr.push(hrt);
    }
    return arr;
  }
}

/* ---------- фон ---------- */
let vignette = null;
let bgGrad = null, bgGradKey = -1;

function makeScenery() {
  const colors = [
    'rgba(255,150,200,0.55)',
    'rgba(255,205,160,0.45)',
    'rgba(200,165,255,0.40)',
    'rgba(255,120,150,0.35)',
    'rgba(255,245,215,0.50)'
  ];

  blobs = [];
  const n = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const rr = (0.25 + Math.random() * 0.35) * Math.min(W, H);
    const grad = bctx.createRadialGradient(0, 0, 0, 0, 0, rr);
    grad.addColorStop(0, colors[i % colors.length]);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    blobs.push({
      x: Math.random(), y: Math.random(), r: rr, grad,
      sp: 0.00006 + Math.random() * 0.00012,
      ph: Math.random() * 6.283,
      ax: 0.06 + Math.random() * 0.1,
      ay: 0.05 + Math.random() * 0.09
    });
  }

  bokeh = [];
  const bn = 5 + Math.floor(Math.random() * 5);
  for (let i = 0; i < bn; i++) {
    const b = new Heart3D(Math.random() * W, Math.random() * H, (isMobile ? 45 : 80) + Math.random() * 70);
    b.alpha = 0.16 + Math.random() * 0.12;
    b.blur = isMobile ? 3 : 7;
    b.vx *= 0.25; b.vy *= 0.25;
    bokeh.push(b);
  }

  vignette = bctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(190,70,120,0.22)');

  bgGrad = null;
  bgGradKey = -1;
}

function paintBackgroundLayer(time) {
  const s = Math.sin(time * 0.00012), c = Math.cos(time * 0.00009);

  const key = Math.round(s * 40) * 100 + Math.round(c * 40);
  if (key !== bgGradKey) {
    bgGrad = bctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0,   `hsl(${348 + s * 10}, 82%, ${74 + s * 4}%)`);
    bgGrad.addColorStop(0.5, `hsl(${322 + c * 12}, 70%, ${70 + c * 4}%)`);
    bgGrad.addColorStop(1,   `hsl(${12 + s * 8}, 78%, ${76 + c * 3}%)`);
    bgGradKey = key;
  }
  bctx.fillStyle = bgGrad;
  bctx.fillRect(0, 0, W, H);

  bctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const bx = (b.x + Math.sin(time * b.sp + b.ph) * b.ax) * W;
    const by = (b.y + Math.cos(time * b.sp * 1.3 + b.ph) * b.ay) * H;
    bctx.save();
    bctx.translate(bx, by);
    bctx.fillStyle = b.grad;
    bctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);
    bctx.restore();
  }
  bctx.globalCompositeOperation = 'source-over';

  for (let i = 0; i < bokeh.length; i++) { bokeh[i].update(2); bokeh[i].draw(bctx); }

  bctx.globalAlpha = 1;
  bctx.fillStyle = vignette;
  bctx.fillRect(0, 0, W, H);
}

function drawRipples() {
  if (!ripples.length) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 2;
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 5.5;
    r.a -= 0.012;
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.globalAlpha = r.a;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function spawnHeart(x, y, size, vel) {
  const h = new Heart3D(x, y, size);
  if (vel) { h.vx = vel.vx; h.vy = vel.vy; }
  hearts.push(h);
  return h;
}

/* ============================================================
   WEBGL — liquid glass (пореgionная загрузка текстуры)
   ============================================================ */
const VS = 'attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }';

const FS = `
precision mediump float;

uniform sampler2D u_bg;
uniform vec4 u_reg;   // x, y (низ-лево), w, h — область фона в текстуре
uniform vec4 u_g1;
uniform vec4 u_g2;
uniform vec4 u_g3;
uniform vec4 u_g4;
uniform float u_dpr;

#define LENS_ZONE 0.45
#define LENS_MAX_PX 60.0
#define ABERRATION 4.0
#define BLUR_I 3.1
#define TINT 0.92
#define SPEC 0.10

float sdRound(vec2 p, vec2 b, float r) {
  vec2 d = abs(p) - b + vec2(r);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - r;
}

vec3 getTex(vec2 c) {
  vec2 uv = (c - u_reg.xy) / u_reg.zw;
  uv = clamp(uv, vec2(0.002), vec2(0.998));
  return texture2D(u_bg, vec2(uv.x, 1.0 - uv.y)).rgb;
}

vec3 getBlur(vec2 c, float r) {
  vec3 sum = vec3(0.0);
  float wsum = 0.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      float w = exp(-0.5 * float(x * x + y * y) / 2.0);
      sum += getTex(c + vec2(float(x), float(y)) * r) * w;
      wsum += w;
    }
  }
  return sum / wsum;
}

vec4 glass(vec2 fc, vec4 g, vec3 bgColor, float bgAlpha) {
  vec2 gsz = g.zw;
  if (gsz.x < 1.0 || gsz.y < 1.0) return vec4(0.0);

  vec2 center = g.xy + gsz * 0.5;
  vec2 p = fc - center;
  vec2 hs = gsz * 0.5;

  if (abs(p.x) > hs.x + 2.0 || abs(p.y) > hs.y + 2.0) return vec4(0.0);

  float size = min(gsz.x, gsz.y);
  float radius = min(size * 0.5, 34.0 * u_dpr);

  float d = sdRound(p, hs, radius);
  float mask = 1.0 - smoothstep(-u_dpr, u_dpr, d);
  if (mask <= 0.001) return vec4(0.0);

  float depth = max(-d, 0.0);

  float e = u_dpr;
  vec2 grad = vec2(
    sdRound(p + vec2(e, 0.0), hs, radius) - sdRound(p - vec2(e, 0.0), hs, radius),
    sdRound(p + vec2(0.0, e), hs, radius) - sdRound(p - vec2(0.0, e), hs, radius)
  );
  vec2 n = normalize(grad + vec2(1e-6));

  float band = min(size * LENS_ZONE, LENS_MAX_PX * u_dpr);
  float t = clamp(depth / band, 0.0, 1.0);
  float distFromCenter = 1.0 - t;
  float distortion = 1.0 - sqrt(max(0.0, 1.0 - distFromCenter * distFromCenter));

  vec2 offset = distortion * n * band;
  vec2 cc = fc + offset;

  float br = BLUR_I * u_dpr * (1.0 - distFromCenter * 0.5);
  vec2 shift = n * ABERRATION * u_dpr * (0.2 + 0.8 * distFromCenter);

  vec3 col = vec3(
    getBlur(cc - shift, br).r,
    getBlur(cc, br).g,
    getBlur(cc + shift, br).b
  );

  col *= TINT;
  col = mix(col, bgColor, bgAlpha);

  float rim = smoothstep(2.5 * u_dpr, 0.0, depth);
  float ndl = max(dot(n, normalize(vec2(-0.5, 0.86))), 0.0);
  col += vec3(SPEC) * rim * ndl * 3.0;

  return vec4(col, mask);
}

void main() {
  vec2 fc = gl_FragCoord.xy;
  vec4 acc = vec4(0.0);

  vec4 s1 = glass(fc, u_g1, vec3(0.0), 0.0);
  acc = mix(acc, vec4(s1.rgb, 1.0), s1.a);

  vec4 s2 = glass(fc, u_g2, vec3(1.0), 0.15);
  acc = mix(acc, vec4(s2.rgb, 1.0), s2.a);

  vec4 s3 = glass(fc, u_g3, vec3(0.0), 0.0);
  acc = mix(acc, vec4(s3.rgb, 1.0), s3.a);

  vec4 s4 = glass(fc, u_g4, vec3(0.93, 0.10, 0.22), 0.25);
  acc = mix(acc, vec4(s4.rgb, 1.0), s4.a);

  gl_FragColor = acc;
}
`;

let gl = null, prog = null;
let uBg, uReg, uG1, uG2, uG3, uG4, uDpr;

function makePass() {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  return { cv, c2d: cv.getContext('2d', { alpha: false }), tex: null, alloc: false };
}
const passCards = makePass();
const passNo = makePass();

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(sh));
    return null;
  }
  return sh;
}

function makeTexture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return t;
}

function initGL() {
  gl = glassCanvas.getContext('webgl', {
    alpha: true,
    premultipliedAlpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    powerPreference: 'high-performance',
    preserveDrawingBuffer: false
  });
  if (!gl) return false;

  const vs = compile(gl.VERTEX_SHADER, VS);
  const fs = compile(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return false;

  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    return false;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  passCards.tex = makeTexture();
  passNo.tex = makeTexture();

  uBg  = gl.getUniformLocation(prog, 'u_bg');
  uReg = gl.getUniformLocation(prog, 'u_reg');
  uG1  = gl.getUniformLocation(prog, 'u_g1');
  uG2  = gl.getUniformLocation(prog, 'u_g2');
  uG3  = gl.getUniformLocation(prog, 'u_g3');
  uG4  = gl.getUniformLocation(prog, 'u_g4');
  uDpr = gl.getUniformLocation(prog, 'u_dpr');

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1i(uBg, 0);
  gl.uniform1f(uDpr, DPR);
  gl.clearColor(0, 0, 0, 0);
  return true;
}

const card1 = document.getElementById('card1');
const card2 = document.getElementById('card2');
const btnYes = document.getElementById('btnYes');
const btnNo = document.getElementById('btnNo');
const btnWrapper = document.getElementById('btnWrapper');
const loveText = document.getElementById('loveText');

let card1Visible = true;
let card2Visible = false;

const REG_PAD = 96;

function rectOf(el, visible) {
  if (!visible) return null;
  const r = el.getBoundingClientRect();
  return (r.width < 1 || r.height < 1) ? null : r;
}

function regionFor(rects) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (r.left < x0) x0 = r.left;
    if (r.top < y0) y0 = r.top;
    if (r.right > x1) x1 = r.right;
    if (r.bottom > y1) y1 = r.bottom;
  }
  x0 = Math.floor(x0 - REG_PAD); y0 = Math.floor(y0 - REG_PAD);
  x1 = Math.ceil(x1 + REG_PAD);  y1 = Math.ceil(y1 + REG_PAD);

  // размер кратен 64, чтобы текстура не переаллоцировалась каждый кадр
  let w = Math.min(W, Math.ceil((x1 - x0) / 64) * 64);
  let h = Math.min(H, Math.ceil((y1 - y0) / 64) * 64);
  x0 = Math.max(0, Math.min(W - w, x0));
  y0 = Math.max(0, Math.min(H - h, y0));
  return { x: x0, y: y0, w, h };
}

function runPass(pass, region, g1, g2, g3, g4) {
  const dw = Math.round(region.w * DPR);
  const dh = Math.round(region.h * DPR);
  if (dw < 2 || dh < 2) return;

  if (pass.cv.width !== dw || pass.cv.height !== dh) {
    pass.cv.width = dw;
    pass.cv.height = dh;
    pass.alloc = false;
  }

  // копируем в GPU только область под панелью, а не весь экран
  pass.c2d.drawImage(
    heartCanvas,
    Math.round(region.x * DPR), Math.round(region.y * DPR), dw, dh,
    0, 0, dw, dh
  );

  gl.bindTexture(gl.TEXTURE_2D, pass.tex);
  if (!pass.alloc) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pass.cv);
    pass.alloc = true;
  } else {
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, pass.cv);
  }

  const gx = Math.round(region.x * DPR);
  const gy = Math.round((H - region.y - region.h) * DPR);

  gl.uniform4f(uReg, gx, gy, dw, dh);
  gl.uniform4f(uG1, g1 ? g1.left * DPR : 0, g1 ? (H - g1.bottom) * DPR : 0, g1 ? g1.width * DPR : 0, g1 ? g1.height * DPR : 0);
  gl.uniform4f(uG2, g2 ? g2.left * DPR : 0, g2 ? (H - g2.bottom) * DPR : 0, g2 ? g2.width * DPR : 0, g2 ? g2.height * DPR : 0);
  gl.uniform4f(uG3, g3 ? g3.left * DPR : 0, g3 ? (H - g3.bottom) * DPR : 0, g3 ? g3.width * DPR : 0, g3 ? g3.height * DPR : 0);
  gl.uniform4f(uG4, g4 ? g4.left * DPR : 0, g4 ? (H - g4.bottom) * DPR : 0, g4 ? g4.width * DPR : 0, g4 ? g4.height * DPR : 0);

  // ножницы: фрагменты вне области даже не запускают шейдер
  gl.scissor(gx, gy, dw, dh);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function renderGL() {
  if (!gl) return;

  gl.disable(gl.SCISSOR_TEST);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST);

  const r1 = rectOf(card1, card1Visible);
  const r2 = rectOf(btnYes, card1Visible);
  const r3 = rectOf(card2, card2Visible);
  const r4 = rectOf(btnNo, noVisible);

  const main = [];
  if (r1) main.push(r1);
  if (r2) main.push(r2);
  if (r3) main.push(r3);
  if (main.length) runPass(passCards, regionFor(main), r1, r2, r3, null);

  if (r4) runPass(passNo, regionFor([r4]), null, null, null, r4);

  gl.disable(gl.SCISSOR_TEST);
}

const loveMessage = 'Я тебя тоже безумно сильно люблю, Лизочка. Ты самое лучшее, что случалось со мной! Будь всегда рядом. ❤️';

function esc(ch) {
  if (ch === '<') return '&lt;';
  if (ch === '>') return '&gt;';
  if (ch === '&') return '&amp;';
  return ch;
}

const ACCENT_WORDS = ['Лизочка'];

function wrapLetters(text) {
  return text.split(' ').map(word => {
    const bare = word.replace(/[^\p{L}]/gu, '').toLowerCase();
    const accent = ACCENT_WORDS.includes(bare) ? ' accent' : '';
    const inner = word.split('').map(ch => `<span class="letter">${esc(ch)}</span>`).join('');
    return `<span class="word${accent}">${inner}</span>`;
  }).join(' ');
}

/* подсветка буквы под курсором ИЛИ под пальцем */
let hotLetter = null;
let lastHotProbe = 0;

function setHotLetter(el) {
  const next = (el && el.classList && el.classList.contains('letter') && !el.classList.contains('gone')) ? el : null;
  if (next === hotLetter) return;
  if (hotLetter) hotLetter.classList.remove('hot');
  hotLetter = next;
  if (hotLetter) {
    hotLetter.classList.add('hot');
    const r = hotLetter.getBoundingClientRect();
    sfx.hover(r.left + r.width / 2);
  }
}

loveText.addEventListener('mousemove', e => setHotLetter(e.target));
loveText.addEventListener('mouseleave', () => setHotLetter(null));

function probeTouch(x, y) {
  const now = performance.now();
  if (now - lastHotProbe < 32) return;   // не чаще ~30 раз в секунду
  lastHotProbe = now;
  setHotLetter(document.elementFromPoint(x, y));
}

function shatterLetter(el) {
  const r = el.getBoundingClientRect();
  const cs = window.getComputedStyle(el);

  const clips = [
    'polygon(0% 0%, 58% 0%, 44% 42%, 0% 55%)',
    'polygon(58% 0%, 100% 0%, 100% 38%, 44% 42%)',
    'polygon(0% 55%, 44% 42%, 52% 74%, 0% 100%)',
    'polygon(44% 42%, 100% 38%, 100% 78%, 52% 74%)',
    'polygon(0% 100%, 52% 74%, 100% 78%, 100% 100%)'
  ];

  const frag = document.createDocumentFragment();
  const nodes = [];

  clips.forEach((clip, i) => {
    const sh = document.createElement('span');
    sh.className = 'shard';
    sh.textContent = el.textContent;
    sh.style.left = r.left + 'px';
    sh.style.top = r.top + 'px';
    sh.style.width = r.width + 'px';
    sh.style.height = r.height + 'px';
    sh.style.fontSize = cs.fontSize;
    sh.style.fontFamily = cs.fontFamily;
    sh.style.fontWeight = cs.fontWeight;
    sh.style.lineHeight = cs.lineHeight;
    sh.style.color = cs.color;
    sh.style.textShadow = '0 0 12px rgba(255,255,255,0.85), 0 0 24px rgba(255,110,175,0.7)';
    sh.style.clipPath = clip;
    sh.style.webkitClipPath = clip;
    frag.appendChild(sh);
    nodes.push({ sh, i });
  });

  document.body.appendChild(frag);

  nodes.forEach(({ sh, i }) => {
    const ang = (i / clips.length) * Math.PI * 2 + (Math.random() - 0.5) * 0.9;
    const dist = 55 + Math.random() * 70;
    const dx = Math.cos(ang) * dist;
    const dy = Math.sin(ang) * dist * 0.75;
    const spin = (Math.random() - 0.5) * 320;
    const dur = 1500 + Math.random() * 500;

    const anim = sh.animate([
      { transform: 'translate(0px, 0px) rotate(0deg) scale(1)', opacity: 1, filter: 'blur(0px)', offset: 0 },
      { transform: `translate(${dx * 0.10}px, ${dy * 0.10}px) rotate(${spin * 0.05}deg) scale(1.14)`, opacity: 1, filter: 'blur(0px)', offset: 0.14 },
      { transform: `translate(${dx * 0.12}px, ${dy * 0.12}px) rotate(${spin * 0.07}deg) scale(1.10)`, opacity: 1, offset: 0.24 },
      { transform: `translate(${dx * 0.65}px, ${dy * 0.65 - 26}px) rotate(${spin * 0.5}deg) scale(0.95)`, opacity: 0.95, filter: 'blur(0px)', offset: 0.55 },
      { transform: `translate(${dx}px, ${dy + 90}px) rotate(${spin}deg) scale(0.4)`, opacity: 0, filter: 'blur(3px)', offset: 1 }
    ], {
      duration: dur,
      delay: i * 45,
      easing: 'cubic-bezier(.18,.62,.3,1)',
      fill: 'forwards'
    });

    anim.onfinish = () => sh.remove();
    setTimeout(() => sh.remove(), dur + i * 45 + 200);
  });
}

function popLetter(el) {
  if (!el || !el.classList.contains('letter') || el.classList.contains('gone')) return;

  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;

  if (hotLetter === el) { el.classList.remove('hot'); hotLetter = null; }

  sfx.letter(cx);
  shatterLetter(el);
  el.classList.add('gone');

  for (let i = 0; i < 12; i++) addSpark(cx, cy, 335 + Math.random() * 35);
  ripples.push({ x: cx, y: cy, r: 4, a: 0.35 });
  spawnHeart(cx, cy, (isMobile ? 12 : 18) + Math.random() * 10, {
    vx: (Math.random() - 0.5) * 2.5,
    vy: -1 - Math.random() * 1.5
  });

  setTimeout(() => {
    const rr = el.getBoundingClientRect();
    const bx = rr.left + rr.width / 2;
    const by = rr.top + rr.height / 2;
    const variants = ['back1', 'back2', 'back3', 'back4', 'back5', 'back6'];
    const v = variants[Math.floor(Math.random() * variants.length)];
    el.classList.remove('gone');
    el.classList.add(v);
    sfx.restore(bx);
    for (let i = 0; i < 7; i++) addSpark(bx, by, 45 + Math.random() * 20);
    setTimeout(() => el.classList.remove(v), 1050);
  }, 3400 + Math.random() * 2200);
}

loveText.addEventListener('click', e => popLetter(e.target));

/* ============================================================
   КНОПКИ
   ============================================================ */
let noPos = null;
let noLastMove = 0;

function flipMove(el, beforeRect, duration = 420) {
  const after = el.getBoundingClientRect();
  const dx = beforeRect.left - after.left;
  const dy = beforeRect.top - after.top;
  if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
  el.animate(
    [
      { transform: `translate(${dx}px, ${dy}px)` },
      { transform: 'translate(0px, 0px)' }
    ],
    { duration, easing: 'cubic-bezier(.3,1.15,.4,1)' }
  );
}

function detachNoButton() {
  if (noButtonRunning) return;
  const r = btnNo.getBoundingClientRect();
  const yesBefore = btnYes.getBoundingClientRect();

  document.body.appendChild(btnNo);

  btnNo.classList.add('instant');
  btnNo.style.position = 'fixed';
  btnNo.style.margin = '0';
  btnNo.style.transform = 'none';
  btnNo.style.left = r.left + 'px';
  btnNo.style.top = r.top + 'px';

  void btnNo.offsetWidth;
  btnNo.classList.remove('instant');
  void btnNo.offsetWidth;

  flipMove(btnYes, yesBefore);

  noPos = { x: r.left, y: r.top };
  noButtonRunning = true;
}

function obstacleRects() {
  const out = [];
  const push = el => {
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width > 1 && r.height > 1) out.push(r);
  };
  push(card1Visible ? card1 : null);
  push(card2Visible ? card2 : null);
  push(document.getElementById('soundToggle'));
  return out;
}

function overlapArea(x, y, w, h, rects, gap) {
  let total = 0;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const ox = Math.min(x + w, r.right + gap) - Math.max(x, r.left - gap);
    const oy = Math.min(y + h, r.bottom + gap) - Math.max(y, r.top - gap);
    if (ox > 0 && oy > 0) total += ox * oy;
  }
  return total;
}

function moveNoButton(px, py) {
  const bw = btnNo.offsetWidth;
  const bh = btnNo.offsetHeight;
  const pad = 12;
  const gap = 10;

  const maxX = Math.max(pad, window.innerWidth - bw - pad);
  const maxY = Math.max(pad, window.innerHeight - bh - pad);
  const clampX = v => Math.max(pad, Math.min(maxX, v));
  const clampY = v => Math.max(pad, Math.min(maxY, v));

  const rects = obstacleRects();

  const cur = noPos || { x: pad, y: pad };
  const curCx = cur.x + bw / 2;
  const curCy = cur.y + bh / 2;

  const ax = (typeof px === 'number' && isFinite(px)) ? px : curCx;
  const ay = (typeof py === 'number' && isFinite(py)) ? py : curCy;

  const minD = isMobile ? 55 : 70;
  const maxD = isMobile ? 95 : 125;

  let best = null, bestScore = -Infinity;

  for (let ring = 0; ring < 3; ring++) {
    const lo = minD + ring * 45;
    const hi = maxD + ring * 90;

    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const dist = lo + Math.random() * (hi - lo);

      const rawX = ax + Math.cos(a) * dist - bw / 2;
      const rawY = ay + Math.sin(a) * dist - bh / 2;
      const tx = clampX(rawX);
      const ty = clampY(rawY);

      const clipped = Math.hypot(tx - rawX, ty - rawY);
      const moved = Math.hypot(tx - cur.x, ty - cur.y);
      const over = overlapArea(tx, ty, bw, bh, rects, gap);

      if (over === 0 && clipped < 4 && moved >= minD * 0.55) {
        best = { x: tx, y: ty };
        bestScore = Infinity;
        break;
      }

      const score = -over / 400 - clipped * 2 + Math.min(moved, 160) * 0.5;
      if (score > bestScore) { bestScore = score; best = { x: tx, y: ty }; }
    }

    if (bestScore === Infinity) break;
  }

  noPos = best;
  btnNo.style.left = noPos.x + 'px';
  btnNo.style.top = noPos.y + 'px';

  for (let i = 0; i < 9; i++) addSpark(curCx, curCy, 350);
  ripples.push({ x: curCx, y: curCy, r: 6, a: 0.35 });
  sfx.no(curCx);
}

function noEscape(e) {
  e.preventDefault();
  e.stopPropagation();

  const now = performance.now();
  if (now - noLastMove < 200) return;
  noLastMove = now;

  const t = e.touches && e.touches[0];
  const px = (typeof e.clientX === 'number') ? e.clientX : (t ? t.clientX : undefined);
  const py = (typeof e.clientY === 'number') ? e.clientY : (t ? t.clientY : undefined);

  detachNoButton();
  moveNoButton(px, py);
}

btnNo.addEventListener('click', noEscape);
btnNo.addEventListener('mouseenter', noEscape);
btnNo.addEventListener('touchstart', noEscape, { passive: false });

btnYes.addEventListener('click', () => {
  sfx.yes();

  const r = btnYes.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;

  for (let i = 0; i < 24; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 3 + Math.random() * 6;
    spawnHeart(cx, cy, (isMobile ? 12 : 18) + Math.random() * 14, {
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 1.5
    });
  }
  for (let i = 0; i < 30; i++) addSpark(cx, cy, 340 + Math.random() * 40);
  ripples.push({ x: cx, y: cy, r: 10, a: 0.6 });

  const yesBefore = btnYes.getBoundingClientRect();
  noVisible = false;
  btnNo.style.display = 'none';
  flipMove(btnYes, yesBefore, 320);

  card1.classList.remove('floating');
  card1.classList.add('fade-out');
  card1Visible = false;

  setTimeout(() => {
    card1.style.display = 'none';
    card2.style.display = 'block';
    card2.classList.add('fade-in');
    card2Visible = true;
    loveText.innerHTML = wrapLetters(loveMessage);
    isInteractive = true;

    const n = isMobile ? 10 : 26;
    for (let i = 0; i < n; i++) spawnHeart();

    setTimeout(() => card2.classList.add('floating'), 1000);
  }, 600);
});

/* ============================================================
   УКАЗАТЕЛЬ
   ============================================================ */
function onPointerMove(x, y) {
  pointer.x = x; pointer.y = y; pointer.active = true;
  if (Math.random() < 0.22) addSpark(x, y, 340 + Math.random() * 40);
}

window.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY), { passive: true });
window.addEventListener('mouseleave', () => { pointer.active = false; });

window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (!t) return;
  onPointerMove(t.clientX, t.clientY);
  probeTouch(t.clientX, t.clientY);   // подсвечиваем букву под пальцем
}, { passive: true });

window.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (t) probeTouch(t.clientX, t.clientY);
}, { passive: true });

window.addEventListener('touchend', () => {
  pointer.active = false;
  setHotLetter(null);
});
window.addEventListener('touchcancel', () => setHotLetter(null));

function handleInteract(cx, cy) {
  ripples.push({ x: cx, y: cy, r: 6, a: 0.45 });
  for (let i = 0; i < 6; i++) addSpark(cx, cy, 340 + Math.random() * 40);

  if (isInteractive) {
    for (let i = hearts.length - 1; i >= 0; i--) {
      if (hearts[i].isClicked(cx, cy)) {
        const parts = hearts[i].split();
        sfx.split(cx);
        hearts.splice(i, 1);
        for (let j = 0; j < parts.length; j++) hearts.push(parts[j]);
        registerPop();
        return;
      }
    }
  }

  spawnHeart(cx, cy, undefined, { vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random() });
  sfx.pop(cx);
}

if (window.PointerEvent) {
  heartCanvas.addEventListener('pointerdown', e => {
    if (!e.isPrimary) return;              // игнорируем второй и последующие пальцы
    handleInteract(e.clientX, e.clientY);
  });
} else {
  // запасной путь для очень старых браузеров без Pointer Events
  let touchedAt = 0;
  heartCanvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (!t) return;
    touchedAt = performance.now();
    handleInteract(t.clientX, t.clientY);
  }, { passive: true });
  heartCanvas.addEventListener('click', e => {
    if (performance.now() - touchedAt < 700) return;   // это эмулированный клик после тапа
    handleInteract(e.clientX, e.clientY);
  });
}


['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
  window.addEventListener(ev, () => sfx.arm(), { capture: true, passive: true })
);

/* ============================================================
   КОМБО: 10 сердечек за 10 секунд → секретная игра
   ============================================================ */
const comboBadge = document.getElementById('comboBadge');
let popStreak = [];
let comboHideTimer = null;

function showCombo(n) {
  clearTimeout(comboHideTimer);
  if (n < 3) { comboBadge.classList.remove('on'); return; }
  comboBadge.textContent = '💗 ' + n + ' / 10';
  comboBadge.classList.add('on');
  comboHideTimer = setTimeout(() => comboBadge.classList.remove('on'), 1600);
}

function registerPop() {
  const t = performance.now();
  popStreak.push(t);
  while (popStreak.length && t - popStreak[0] > 10000) popStreak.shift();
  if (popStreak.length >= 10 && !game.open) {
    popStreak.length = 0;
    comboBadge.classList.remove('on');
    game.enter();
    return;
  }
  showCombo(popStreak.length);
}

/* ============================================================
   FLAPPY HEART — процедурная карта в стиле сайта
   ============================================================ */
const game = (() => {
  const cv = document.getElementById('gameCanvas');
  const g = cv.getContext('2d');
  const layer = document.getElementById('gameLayer');
  const panel = document.getElementById('gamePanel');
  const titleEl = document.getElementById('gameTitle');
  const subEl = document.getElementById('gameSub');
  const scoreEl = document.getElementById('gameScore');
  const bestEl = document.getElementById('gameBest');
  const playBtn = document.getElementById('gamePlay');
  const exitBtn = document.getElementById('gameExit');

  let open = false, playing = false, dead = false;
  let bird = null, cols = [], score = 0, best = 0;
  let walk = 0, seed = 7, shake = 0;
  let savedCard1 = false, savedCard2 = false, savedNo = false;

  try { best = parseInt(localStorage.getItem('flappyHeartBest') || '0', 10) || 0; } catch (e) {}

  const GRAV = 0.0026;
  const FLAP = -0.72;

  // масштаб от меньшей стороны: на узком экране колонны не расползаются
  const S = () => Math.min(1.35, Math.max(0.58, Math.min(H, W * 1.1) / 780));

  // детерминированный ГПСЧ — карта генерируется на ходу, seed новый на каждый забег
  function rnd() {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  }

  function addColumn(x) {
    const s = S();
    const w = (isMobile ? 62 : 78) * s;
    const gapMin = (isMobile ? 138 : 152) * s;
    const gapH = Math.max(gapMin, (isMobile ? 210 : 235) * s - score * 3.0 * s);
    const margin = 64 * s;
    const lo = margin + gapH / 2;
    const hi = H - margin - gapH / 2;

    // случайное блуждание центра прохода: карта плавная, но непредсказуемая
    walk += (rnd() - 0.5) * 280 * s;
    if (walk < lo) walk = lo + (lo - walk) * 0.5;
    if (walk > hi) walk = hi - (walk - hi) * 0.5;
    walk = Math.max(lo, Math.min(hi, walk));

    const moving = score > 7 && rnd() < 0.32;
    cols.push({
      x, w, gapY: walk, gapH,
      amp: moving ? (26 + rnd() * 42) * s : 0,
      sp: 0.0008 + rnd() * 0.0009,
      ph: rnd() * 6.283,
      passed: false,
      coin: rnd() < 0.55,
      coinGot: false
    });
  }

  const gapCenter = (c, time) => c.amp ? c.gapY + Math.sin(time * c.sp + c.ph) * c.amp : c.gapY;

  function rr(x, y, w, h, r) {
    const k = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + k, y);
    g.lineTo(x + w - k, y);
    g.quadraticCurveTo(x + w, y, x + w, y + k);
    g.lineTo(x + w, y + h - k);
    g.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
    g.lineTo(x + k, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - k);
    g.lineTo(x, y + k);
    g.quadraticCurveTo(x, y, x + k, y);
    g.closePath();
  }

  function drawCol(c, gy, s) {
    if (c.x > W + 40 || c.x + c.w < -40) return;
    const topH = gy - c.gapH / 2;
    const botY = gy + c.gapH / 2;

    const grad = g.createLinearGradient(c.x, 0, c.x + c.w, 0);
    grad.addColorStop(0,    'rgba(255,255,255,0.46)');
    grad.addColorStop(0.35, 'rgba(255,196,220,0.34)');
    grad.addColorStop(1,    'rgba(212,58,118,0.30)');
    g.fillStyle = grad;
    g.strokeStyle = 'rgba(255,255,255,0.6)';
    g.lineWidth = 1.4;

    const r = 16 * s;
    rr(c.x, -60, c.w, topH + 60, r); g.fill(); g.stroke();
    rr(c.x, botY, c.w, H - botY + 60, r); g.fill(); g.stroke();

    // «губы» у самого проёма — как у труб в оригинале, но стеклянные
    const lipH = 15 * s, over = 7 * s;
    g.fillStyle = 'rgba(255,255,255,0.5)';
    rr(c.x - over, topH - lipH, c.w + over * 2, lipH, 9 * s); g.fill(); g.stroke();
    rr(c.x - over, botY, c.w + over * 2, lipH, 9 * s); g.fill(); g.stroke();

    // вертикальный блик
    g.fillStyle = 'rgba(255,255,255,0.32)';
    g.fillRect(c.x + 4 * s, -60, 2.4 * s, topH + 60 - lipH);
    g.fillRect(c.x + 4 * s, botY + lipH, 2.4 * s, H - botY);
  }

  function drawCoin(c, gy, time, s) {
    if (!c.coin || c.coinGot || c.x > W + 40 || c.x + c.w < -40) return;
    const size = 20 * s;
    const sp = heartSprite(3, size, 0);
    const p = 1 + Math.sin(time * 0.006 + c.ph) * 0.13;
    g.save();
    g.globalAlpha = 0.95;
    g.translate(c.x + c.w / 2, gy);
    g.rotate(Math.sin(time * 0.003 + c.ph) * 0.28);
    const k = (size / sp.d) * p;
    g.scale(k, k);
    g.drawImage(sp.cv, -sp.half, -sp.half);
    g.restore();
  }

  function drawBird(time, s) {
    const size = 34 * s;
    const sp = heartSprite(1, size, 0);
    const ft = Math.min(1, (time - bird.lastFlap) / 260);
    const squash = 1 + (1 - ft) * 0.2;
    g.save();
    g.translate(bird.x, bird.y);
    g.rotate(bird.rot);
    const k = size / sp.d;
    g.scale(k * squash, k / squash);
    g.shadowColor = 'rgba(190,30,80,0.4)';
    g.shadowBlur = 22;
    g.drawImage(sp.cv, -sp.half, -sp.half);
    g.restore();
  }

  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
  }

  function die() {
    if (dead) return;
    playing = false;
    dead = true;
    shake = 15;
    sfx.no(bird.x);
    for (let i = 0; i < 26; i++) addSpark(bird.x, bird.y, 340 + Math.random() * 40);
    ripples.push({ x: bird.x, y: bird.y, r: 10, a: 0.6 });
    if (score > best) {
      best = score;
      try { localStorage.setItem('flappyHeartBest', String(best)); } catch (e) {}
    }
    bestEl.textContent = 'Лучший: ' + best;
    titleEl.textContent = score >= 20 ? 'Ты профи 💗' : (score >= 8 ? 'Красиво летела!' : 'Ой...');
    subEl.innerHTML = 'Очков: <b>' + score + '</b><br>Лучший результат: <b>' + best + '</b>';
    playBtn.textContent = 'Ещё раз';
    setTimeout(() => { if (dead) panel.classList.remove('hidden'); }, 550);
  }

  function collide(time, s) {
    const r = 15 * s;
    for (let i = 0; i < cols.length; i++) {
      const c = cols[i];
      const gy = gapCenter(c, time);
      if (!c.passed && c.x + c.w < bird.x) {
        c.passed = true;
        addScore(1);
        sfx.pop(bird.x);
      }
      if (bird.x + r > c.x && bird.x - r < c.x + c.w) {
        if (bird.y - r < gy - c.gapH / 2 || bird.y + r > gy + c.gapH / 2) { die(); return; }
      }
      if (c.coin && !c.coinGot &&
          Math.abs(bird.x - (c.x + c.w / 2)) < r + 14 * s &&
          Math.abs(bird.y - gy) < r + 17 * s) {
        c.coinGot = true;
        addScore(2);
        sfx.restore(bird.x);
        for (let k = 0; k < 10; k++) addSpark(bird.x, bird.y, 45 + Math.random() * 20);
      }
    }
    if (bird.y > H - 8 * s || bird.y < -40) die();
  }

  function start() {
    const s = S();
    seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) % 4294967296 || 7;
    cols = [];
    score = 0;
    dead = false;
    playing = true;
    shake = 0;
    scoreEl.textContent = '0';
    bestEl.textContent = 'Лучший: ' + best;
    walk = H * 0.5;
    bird = { x: W * (isMobile ? 0.28 : 0.3), y: H * 0.42, vy: FLAP * 0.55 * s, rot: 0, lastFlap: performance.now() };
    let x = W + 130 * s;
    const spacing = (isMobile ? 235 : 300) * s;
    for (let i = 0; i < 4; i++) { addColumn(x); x += spacing; }
    panel.classList.add('hidden');
  }

  function flap() {
    if (!open || dead) return;
    if (!playing) { start(); return; }
    const s = S();
    bird.vy = FLAP * s;
    bird.lastFlap = performance.now();
    sfx.tap(bird.x);
    for (let i = 0; i < 4; i++) addSpark(bird.x - 8 * s, bird.y + 10 * s, 340 + Math.random() * 30);
  }

  function enter() {
    if (open) return;
    open = true;
    playing = false;
    dead = false;
    savedCard1 = card1Visible;
    savedCard2 = card2Visible;
    savedNo = noVisible;
    if (card1Visible) card1.classList.add('game-hidden');
    if (card2Visible) card2.classList.add('game-hidden');
    card1Visible = false;
    card2Visible = false;
    noVisible = false;
    btnNo.style.visibility = 'hidden';
    cv.classList.add('on');
    layer.classList.add('on');
    panel.classList.remove('hidden');
    titleEl.textContent = 'Секретный уровень 💗';
    subEl.innerHTML = 'Десять сердечек за десять секунд — ты нашла игру!<br>Тап или пробел, чтобы взлететь. Сердечки в проёмах дают +2.';
    playBtn.textContent = 'Полетели';
    scoreEl.textContent = '0';
    bestEl.textContent = 'Лучший: ' + best;
    cols = [];
    score = 0;
    bird = { x: W * 0.3, y: H * 0.45, vy: 0, rot: 0, lastFlap: 0 };
    sfx.yes();
  }

  function exit() {
    open = false;
    playing = false;
    dead = false;
    cols = [];
    cv.classList.remove('on');
    layer.classList.remove('on');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    card1.classList.remove('game-hidden');
    card2.classList.remove('game-hidden');
    card1Visible = savedCard1;
    card2Visible = savedCard2;
    noVisible = savedNo;
    if (savedNo) btnNo.style.visibility = '';
  }

  function resizeCv() {
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function frame(dt, time) {
    if (!open) return;
    const s = S();
    const step = Math.min(34, dt > 0 ? dt : 16);

    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0.3) {
      g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
    }

    if (playing) {
      const speed = (0.26 + Math.min(0.13, score * 0.0035)) * s;
      bird.vy += GRAV * s * step;
      bird.y += bird.vy * step;
      bird.rot = Math.max(-0.55, Math.min(1.15, (bird.vy / s) * 1.5));
      for (let i = 0; i < cols.length; i++) cols[i].x -= speed * step;
      while (cols.length && cols[0].x + cols[0].w < -80) cols.shift();
      const spacing = (isMobile ? 235 : 300) * s;
      const lastX = cols.length ? cols[cols.length - 1].x : W;
      if (lastX < W + spacing) addColumn(lastX + spacing);   // карта достраивается бесконечно
      if (Math.random() < 0.45) addSpark(bird.x - 12 * s, bird.y + 8 * s, 335 + Math.random() * 30);
      collide(time, s);
    } else if (dead) {
      bird.vy += GRAV * s * step;
      bird.y = Math.min(H + 80, bird.y + bird.vy * step);
      bird.rot = Math.min(1.6, bird.rot + 0.0025 * step);
    } else {
      bird.y = H * 0.45 + Math.sin(time * 0.004) * 10 * s;
      bird.rot = Math.sin(time * 0.004) * 0.12;
    }

    for (let i = 0; i < cols.length; i++) {
      const c = cols[i];
      const gy = gapCenter(c, time);
      drawCol(c, gy, s);
      drawCoin(c, gy, time, s);
    }
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.fillRect(0, H - 6 * s, W, 6 * s);
    drawBird(time, s);
  }

  cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  playBtn.addEventListener('click', () => { if (!playing || dead) start(); });
  exitBtn.addEventListener('click', exit);
  window.addEventListener('keydown', e => {
    if (!open) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (dead) start(); else flap();
    } else if (e.code === 'Escape') {
      exit();
    }
  });

  return {
    enter, exit, flap, frame,
    resize: resizeCv,
    get open() { return open; },
    get playing() { return playing; }
  };
})();

/* ============================================================
   РЕСАЙЗ И ЦИКЛ
   ============================================================ */
let resizeTimer = null;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  isMobile = Math.min(W, H) < 700;

  heartCanvas.width = Math.round(W * DPR);
  heartCanvas.height = Math.round(H * DPR);
  heartCanvas.style.width = W + 'px';
  heartCanvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;

  bgCanvas.width = Math.max(2, Math.round(W * DPR * BG_SCALE));
  bgCanvas.height = Math.max(2, Math.round(H * DPR * BG_SCALE));
  bctx.setTransform(DPR * BG_SCALE, 0, 0, DPR * BG_SCALE, 0, 0);

  glassCanvas.width = heartCanvas.width;
  glassCanvas.height = heartCanvas.height;
  glassCanvas.style.width = W + 'px';
  glassCanvas.style.height = H + 'px';

  if (gl) {
    gl.viewport(0, 0, glassCanvas.width, glassCanvas.height);
    passCards.alloc = false;
    passNo.alloc = false;
  }

  heartSprites.clear();

  if (noButtonRunning && noPos) {
    const bw = btnNo.offsetWidth, bh = btnNo.offsetHeight, pad = 12;
    noPos.x = Math.max(pad, Math.min(W - bw - pad, noPos.x));
    noPos.y = Math.max(pad, Math.min(H - bh - pad, noPos.y));
    btnNo.style.left = noPos.x + 'px';
    btnNo.style.top = noPos.y + 'px';
  }
  game.resize();
  makeScenery();
}

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 120);
});

let frameParity = 0;
let slowFrames = 0, glassEveryOther = false, lastTime = 0;

function animate(time) {
  requestAnimationFrame(animate);

  const dt = time - lastTime;
  lastTime = time;
  if (dt > 26 && dt < 500) {
    if (++slowFrames > 45) { glassEveryOther = true; slowFrames = 0; }
  } else if (slowFrames > 0) {
    slowFrames--;
  }

  frameParity ^= 1;

  // мягкий фон обновляется через кадр — он и так меняется очень медленно
  if (frameParity === 0) paintBackgroundLayer(time);
  ctx.drawImage(bgCanvas, 0, 0, W, H);

  if (time - lastSpawn > 2600) {
    if (hearts.length < AUTOSPAWN_CAP) spawnHeart();
    lastSpawn = time;
  }

  for (let i = 0; i < hearts.length; i++) { hearts[i].update(1); hearts[i].draw(ctx); }
  ctx.globalAlpha = 1;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0) {
      particles.splice(i, 1);
      if (sparkPool.length < 200) sparkPool.push(p);
    }
  }
  ctx.globalAlpha = 1;

  drawRipples();
  if (game.open) game.frame(dt, time);
  if (!glassEveryOther || frameParity === 0) renderGL();
}

resize();
initGL();
resize();
paintBackgroundLayer(0);

for (let i = 0; i < (isMobile ? 8 : 16); i++) spawnHeart();

requestAnimationFrame(animate);
</script>
